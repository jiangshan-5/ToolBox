<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="toolbox_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>toolbox_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🎨 Elegant Dark-Purple Loading System Stylesheet -->
  <style>
    body {
      background-color: #141221;
      margin: 0;
      overflow: hidden;
    }
    #loading {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #141221 0%, #1a153b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(138, 75, 243, 0.1);
      border-radius: 50%;
      border-top-color: #8a4bf3;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      -webkit-animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    .loading-text {
      margin-top: 24px;
      color: #b0a9df;
      font-size: 15px;
      letter-spacing: 1.5px;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @-webkit-keyframes spin {
      to { -webkit-transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 🔮 Live Dark Purple Splash Screen Overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Toolbox Pro 正在初始化极速引擎...</div>
  </div>

  <script>
    // 🚀 High-performance Observer to instantly fade out the loader once the Flutter Canvas renders
    const observer = new MutationObserver((mutations) => {
      if (document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.transition = 'opacity 0.5s ease-out';
          loading.style.opacity = '0';
          setTimeout(() => loading.remove(), 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
